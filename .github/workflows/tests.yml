name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Start MySQL
        run: docker compose up -d --wait mysql

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Audit locked dependencies
        run: |
          composer audit --locked
          npm audit

      - name: Install CI browser
        run: npx playwright install --with-deps chromium

      - name: Run critical browser coverage
        env:
          HABIT_LOG_E2E: '1'
        run: npm run test:e2e

      - name: Build production image
        run: docker build --target production -t habit-log:production .

      - name: Verify production image runtime
        run: sh tests/Containers/smoke.sh

      - name: Preserve synthetic browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failure-screenshots
          path: storage/app/phase7-checks/browser-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
