ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    # Reset tokens occur in paths; other sensitive values can occur in queries.
    SetEnvIf Request_URI "^/reset-password/" omit_access_log
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" private
    CustomLog /proc/self/fd/1 private env=!omit_access_log
</VirtualHost>
