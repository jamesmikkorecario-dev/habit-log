name: habit-log

services:
  app:
    image: habit-log:development
    build:
      context: .
      target: development
      args:
        LOCAL_UID: "${LOCAL_UID:-1000}"
        LOCAL_GID: "${LOCAL_GID:-1000}"
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_URL: ""
    volumes:
      - .:/var/www/html
      - composer-dependencies:/var/www/html/vendor
      - node-dependencies:/var/www/html/node_modules
      - compiled-views:/var/www/html/storage/framework/views
    depends_on:
      mysql:
        condition: service_healthy

  vite:
    image: habit-log:development
    pull_policy: never
    init: true
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    environment:
      DOCKER_VITE: "1"
      VITE_PORT: "${VITE_PORT:-5173}"
    volumes:
      - .:/var/www/html
      - composer-dependencies:/var/www/html/vendor
      - node-dependencies:/var/www/html/node_modules
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5173/@vite/client"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      app:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: habit-log-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-habit_log}"
      MYSQL_USER: "${DB_USERNAME:-habit_log}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-habit_log_local}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-habit_log_root_local}"
      MYSQL_TEST_DATABASE: "${DB_TEST_DATABASE:-habit_log_test}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
  composer-dependencies:
  node-dependencies:
  compiled-views:
